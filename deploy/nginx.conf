# عزوتك: Nginx reverse proxy + TLS baseline.
# Replace app.example.jo and certificate paths before enabling.
# Keep the Python process bound to 127.0.0.1:8000; do not expose it publicly.

events {}

http {
    server_tokens off;

    # Edge throttling. Keep the in-process limiter too; defense in depth.
    limit_req_zone $binary_remote_addr zone=ezwatek_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ezwatek_login:10m rate=5r/m;

    upstream ezwatek_app {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name app.example.jo;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.example.jo;

        ssl_certificate /etc/letsencrypt/live/app.example.jo/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.example.jo/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

        client_max_body_size 1m;
        client_body_timeout 10s;
        keepalive_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # The application creates a nonce-based CSP. Do not replace it here.
        # For ModSecurity/Coraza, enable the module and CRS at the edge:
        # modsecurity on;
        # modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

        location ~ /\. { deny all; }

        location = /api/auth/login {
            limit_req zone=ezwatek_login burst=3 nodelay;
            proxy_pass http://ezwatek_app;
        }

        location / {
            limit_req zone=ezwatek_general burst=30 nodelay;
            proxy_pass http://ezwatek_app;
        }
    }
}
